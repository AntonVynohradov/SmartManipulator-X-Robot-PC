name: The SmartManipulator-X Documentation Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0   # git describe: document version on the PDF cover

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-docs.txt
          python -m playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Runs `mkdocs build` (strict) and writes site/SmartManipulator-X.pdf,
      # so the published site also serves the PDF manual.
      - name: Build HTML site and PDF manual
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python tools/docs/build_pdf.py --browser chromium

      - name: Upload PDF manual
        uses: actions/upload-artifact@v4
        with:
          name: SmartManipulator-X-pdf
          path: site/SmartManipulator-X.pdf

      # `mkdocs gh-deploy` would rebuild site/ and drop the PDF, so the
      # already built site/ is pushed with ghp-import (a MkDocs dependency).
      - name: Deploying documentation
        run: |
          ghp-import --no-jekyll --push --force --no-history site
