<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3c4043"/>
    </marker>
  </defs>
  <style>
    .pc { fill: #f1f3f4; stroke: #5f6368; stroke-width: 1.5; }
    .kit { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.5; }
    .soc { fill: #d2e3fc; stroke: #1a73e8; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .mcu { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.5; }
    .fab { fill: #e6f4ea; stroke: #188038; stroke-width: 1.5; }
    .drv { fill: #fef7e0; stroke: #b06000; stroke-width: 1.5; }
    .mech { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .h { font-weight: 700; font-size: 15px; fill: #202124; }
    .t { fill: #202124; }
    .s { fill: #5f6368; font-size: 12px; }
    .l { stroke: #3c4043; stroke-width: 2; fill: none; marker-end: url(#a); }
    .b { stroke: #3c4043; stroke-width: 2; fill: none; marker-end: url(#a); marker-start: url(#a); }
  </style>

  <!-- PCs -->
  <rect class="pc" x="40" y="20" width="300" height="100" rx="8"/>
  <text class="h" x="55" y="46">Operator PC</text>
  <text class="t" x="55" y="68">MoveIt 2 · RViz2 · Gazebo</text>
  <text class="s" x="55" y="88">separate repository</text>

  <rect class="pc" x="560" y="20" width="500" height="100" rx="8"/>
  <text class="h" x="575" y="46">Robot PC</text>
  <text class="t" x="575" y="68">ROS 2 Jazzy · ros2_control · ROBOTIS hardware interface · DynamixelSDK</text>
  <text class="s" x="575" y="88">separate repository · sends '&amp;' after opening the port</text>

  <path class="b" d="M340 70 L560 70"/>
  <text class="s" x="450" y="62" text-anchor="middle">ROS 2 DDS</text>

  <!-- Kit -->
  <rect class="kit" x="40" y="180" width="1020" height="410" rx="10"/>
  <text class="h" x="55" y="206">M2S Hello FPGA Kit</text>

  <rect class="mcu" x="640" y="200" width="400" height="60" rx="6"/>
  <text class="t" x="655" y="224">MCP2221A USB-UART  →  PIC32 (pass-through after '&amp;')</text>
  <text class="s" x="655" y="244">460800 bps (PC side)  →  230400 bps (SmartFusion2 side)</text>

  <!-- Host link -->
  <path class="l" d="M840 120 L840 200"/>
  <text class="s" x="830" y="143" text-anchor="end">USB CDC ACM · /dev/ttyACM0 · 460800 bps</text>
  <text class="s" x="830" y="160" text-anchor="end">DYNAMIXEL Protocol 2.0</text>

  <!-- SmartFusion2 -->
  <rect class="soc" x="55" y="280" width="990" height="295" rx="8"/>
  <text class="h" x="70" y="302">SmartFusion2 M2S010</text>

  <path class="l" d="M640 230 L520 230 L520 315"/>
  <text class="s" x="530" y="300">MMUART_0</text>

  <rect class="mcu" x="70" y="315" width="560" height="245" rx="6"/>
  <text class="h" x="85" y="340">Cortex-M3 · Zephyr firmware (Controller repository)</text>
  <text class="t" x="85" y="365">MMUART_0 → Protocol 2.0 parser → device dispatch</text>
  <text class="t" x="85" y="387">ID 1–6    virtual XW430-T333-R → motor layer (6 workers)</text>
  <text class="t" x="85" y="409">ID 7       gripper servo → software ramp (20 ms steps)</text>
  <text class="t" x="85" y="431">ID 200   controller: detected drivers, backend, servo ID</text>
  <text class="s" x="85" y="455">target backend: TMC5160 over SPI · simulation backend: modelled axes</text>

  <rect class="mcu" x="85" y="475" width="250" height="65" rx="4"/>
  <text class="t" x="100" y="500">MSS SPI_0 · SS0–SS5</text>
  <text class="s" x="100" y="522">mode 3 · ≤ 2 MHz</text>
  <rect class="mcu" x="360" y="475" width="255" height="65" rx="4"/>
  <text class="t" x="375" y="500">FIC_0 / APB master</text>
  <text class="s" x="375" y="522">CorePWM registers at 0x5000_0000</text>

  <rect class="fab" x="660" y="315" width="370" height="245" rx="6"/>
  <text class="h" x="675" y="340">FPGA fabric (Libero design)</text>
  <text class="t" x="675" y="365">routes SPI_0 and MMUART_0 to the pins</text>
  <text class="t" x="675" y="389">CorePWM channel 1: 50 Hz, 1–2 ms pulse</text>
  <text class="s" x="675" y="413">no STEP/DIR, no encoders (stage 1)</text>
  <text class="s" x="675" y="445">hardware contract: SmartManipulator-X-Libero,</text>
  <text class="s" x="675" y="463">docs/firmware_interface.md</text>
  <path class="l" d="M615 508 L660 508"/>

  <!-- Drivers -->
  <path class="l" d="M210 540 L210 630"/>
  <text class="s" x="220" y="614">SPI_0, CS0–CS5 (Arduino D10, D8, D7–D4)</text>

  <path class="l" d="M845 560 L845 630"/>
  <text class="s" x="855" y="614">D3 / N7 · 3.3 V PWM</text>

  <rect class="drv" x="40" y="630" width="460" height="90" rx="8"/>
  <text class="h" x="55" y="656">6× TMC5160T Pro (motion-controller mode)</text>
  <text class="t" x="55" y="678">ramps and position counter inside the driver</text>
  <text class="s" x="55" y="698">VM 24 V · logic from VM: switch 24 V on before the kit</text>

  <rect class="drv" x="600" y="630" width="460" height="90" rx="8"/>
  <text class="h" x="615" y="656">MG996R gripper servo (ID 7)</text>
  <text class="t" x="615" y="678">6 V from DC/DC 24 → 6 V (≥ 5 A)</text>
  <text class="s" x="615" y="698">open loop: no position feedback</text>

  <!-- Mechanics -->
  <path class="l" d="M270 720 L270 760"/>
  <text class="s" x="280" y="745">6 stepper motors (NEMA14/17/23)</text>
  <path class="l" d="M830 720 L830 760"/>
  <text class="s" x="840" y="745">gripper jaws</text>

  <rect class="mech" x="40" y="760" width="1020" height="70" rx="8"/>
  <text class="h" x="55" y="786">BCN3D Moveo mechanics</text>
  <text class="t" x="55" y="808">J1 base (ID 1) · J2 shoulder (IDs 2 + 3) · J3 elbow (ID 4) · J4 forearm roll (ID 5) · J5 wrist (ID 6) · gripper (ID 7)</text>
</svg>
